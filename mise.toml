[tools]
go = "1.26.5"
node = "24"

[env]
_.file = { path = ".env", redact = true }

# ---------------------------------------------------------------------------
# web
#
# The SvelteKit build writes straight into internal/web/dist so the Go embed
# has nothing to copy. See web/vite.config.ts (adapter pages/assets options).
# The SPA is built once and both engines share it.
# ---------------------------------------------------------------------------

[tasks."web:install"]
description = "Install frontend dependencies"
dir = "web"
run = "npm ci"

[tasks."web:build"]
description = "Build the SvelteKit SPA into internal/web/dist"
dir = "web"
# The .gitkeep that adapter-static wipes is put back by the build script itself
# (web/scripts/keep-embed-dir.mjs), so every entry point is covered — this task,
# a bare `npm run build`, and playwright's webServer.
run = "npm run build"
# Paths are relative to `dir`, so the build output is one level up.
sources = ["src/**/*", "package.json", "vite.config.ts"]
outputs = ["../internal/web/dist/index.html"]

[tasks."web:dev"]
description = "Vite dev server on :5173, proxying /api to :8080"
dir = "web"
run = "npm run dev"

[tasks."web:check"]
description = "svelte-check"
dir = "web"
run = "npm run check"

# ---------------------------------------------------------------------------
# go
# ---------------------------------------------------------------------------

[tasks."go:run"]
description = "Run the API server on :8080 without embedding the UI"
run = "go run ./cmd/skills-dashboard --port 8080"

# The binaries land in bin/, which is gitignored. While the contest venue had
# node but no Go toolchain they were committed instead; that constraint is gone
# and the history keeps the copies that actually ran (see README).
#
# The names carry node's process.platform and process.arch rather than GOOS and
# GOARCH, so start.mjs assembles the filename it needs without translating
# between two vocabularies. -w drops DWARF on top of -s, which is a fifth of the
# file.

[tasks."build:windows"]
description = "Cross-compile the committed binary for Windows"
depends = ["web:build"]
run = 'go build -trimpath -ldflags="-s -w" -o bin/skills-dashboard-win32-x64.exe ./cmd/skills-dashboard'
env = { GOOS = "windows", GOARCH = "amd64", CGO_ENABLED = "0" }

[tasks."build:linux"]
description = "Cross-compile the committed binary for Linux"
depends = ["web:build"]
run = 'go build -trimpath -ldflags="-s -w" -o bin/skills-dashboard-linux-x64 ./cmd/skills-dashboard'
env = { GOOS = "linux", GOARCH = "amd64", CGO_ENABLED = "0" }

[tasks.build]
description = "Build both platform binaries into bin/"
depends = ["build:windows", "build:linux"]

# ---------------------------------------------------------------------------
# node
#
# 두 번째 엔진. 대회장에서 실행이 허용된 것이 node 였고, 이쪽이 실제로 돌아갔다.
# 산출물은 server/dist/skills-dashboard.mjs 하나이고, 의존성이 전부 인라인되어
# 있어 실행하는 쪽에는 npm install 이 필요 없다.
# ---------------------------------------------------------------------------

[tasks."node:install"]
description = "Install the node server's build dependencies"
dir = "server"
run = "npm ci"

[tasks."node:build"]
description = "Bundle the node engine into server/dist/skills-dashboard.mjs"
dir = "server"
depends = ["web:build"]
run = "npm run build"
sources = ["src/**/*.ts", "scripts/build.mjs", "package.json", "../internal/web/dist/index.html"]
outputs = ["dist/skills-dashboard.mjs"]

[tasks."node:check"]
description = "tsc --noEmit over the node server"
dir = "server"
run = "npm run check"

[tasks."node:run"]
description = "Run the node engine on :8080 (the Go engine is go:run)"
run = "node server/dist/skills-dashboard.mjs --port 8080 --open=false"

[tasks.parity]
description = "Compare the two engines' answers endpoint by endpoint"
run = "node scripts/parity.mjs"

# ---------------------------------------------------------------------------
# quality
# ---------------------------------------------------------------------------

[tasks.test]
description = "Go unit tests + frontend unit tests"
run = [
  "go test ./...",
  "npm --prefix web run test:unit -- --run",
]

[tasks."test:go"]
description = "Go unit tests"
run = "go test ./..."

[tasks."test:e2e"]
description = "Playwright layout checks"
dir = "web"
run = "npm run test:e2e"

[tasks.lint]
description = "go vet + prettier + eslint"
run = [
  "go vet ./...",
  "npm --prefix web run lint",
]

[tasks.fmt]
description = "gofmt + prettier"
run = [
  "go fmt ./...",
  "npm --prefix web run format",
]
